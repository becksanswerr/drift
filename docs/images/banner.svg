<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="DRIFT — Distributed Routing for Inference and Feature Tasks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111b2e"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#30363d"/>
  <circle cx="930" cy="150" r="230" fill="url(#glow)"/>

  <!-- wordmark -->
  <text class="t" x="72" y="150" font-size="86" font-weight="700" letter-spacing="14" fill="url(#wordmark)">DRIFT</text>
  <text class="t" x="76" y="192" font-size="20" fill="#c9d1d9">Distributed Routing for Inference and Feature Tasks</text>
  <text class="m" x="76" y="226" font-size="15" fill="#8b949e">serverless · peer-to-peer · capability-routed · zero-config</text>

  <g class="m" font-size="13" fill="#7dd3fc">
    <rect x="76" y="248" width="152" height="30" rx="15" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="92" y="268">pip install drift-ai</text>
    <rect x="240" y="248" width="120" height="30" rx="15" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="256" y="268" fill="#c4b5fd">MIT licence</text>
  </g>

  <!-- hive motif: five machines, one winning the current auction -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5" fill="none">
    <path d="M820 96 L960 60 M820 96 L950 168 M960 60 L1080 118 M950 168 L1080 118 M950 168 L1010 238 M1080 118 L1010 238 M820 96 L950 168"/>
  </g>
  <g>
    <circle cx="820" cy="96" r="17" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>
    <circle cx="960" cy="60" r="17" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>
    <circle cx="1080" cy="118" r="17" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>
    <circle cx="1010" cy="238" r="17" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>
    <circle cx="950" cy="168" r="26" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="950" cy="168" r="7" fill="#38bdf8"/>
  </g>
  <text class="m" x="950" y="212" font-size="12" fill="#7dd3fc" text-anchor="middle">winner · 92p</text>
</svg>
